<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KLYRO AI - Dashboard</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#05070d;
color:white;
min-height:100vh;
}

button{
cursor:pointer;
border:none;
}

.app{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:240px;
position:fixed;
left:0;
top:0;
bottom:0;
background:#0a0e18;
border-right:1px solid #182033;
padding:25px 16px;
z-index:10;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:35px;
}

.logo span{
color:#7c5cff;
}

.nav button{
width:100%;
padding:14px;
margin-bottom:8px;
background:transparent;
color:#aeb7ca;
text-align:left;
border-radius:10px;
font-size:15px;
}

.nav button:hover,
.nav button.active{
background:#171d30;
color:white;
}

/* MAIN */

.main{
margin-left:240px;
width:calc(100% - 240px);
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.top h1{
font-size:28px;
}

.profile{
background:#121827;
padding:10px 15px;
border-radius:12px;
color:#b9c1d3;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.card{
background:#0d1320;
border:1px solid #1b2538;
border-radius:16px;
padding:20px;
}

.card small{
color:#7f8ba3;
}

.card h2{
margin-top:10px;
font-size:25px;
}

/* SECTIONS */

.page{
display:none;
}

.page.active{
display:block;
}

.create-box{
background:#0d1320;
border:1px solid #1b2538;
border-radius:18px;
padding:25px;
}

.create-box h2{
margin-bottom:15px;
}

textarea{
width:100%;
height:150px;
background:#080c15;
border:1px solid #25314a;
border-radius:12px;
padding:16px;
color:white;
font-size:15px;
resize:none;
outline:none;
}

textarea:focus{
border-color:#7c5cff;
}

.options{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:15px;
}

select{
width:100%;
padding:13px;
background:#080c15;
color:white;
border:1px solid #25314a;
border-radius:10px;
}

.generate{
width:100%;
margin-top:18px;
padding:16px;
border-radius:12px;
background:linear-gradient(135deg,#7c5cff,#b34cff);
color:white;
font-size:16px;
font-weight:bold;
}

.generate:disabled{
opacity:.5;
}

/* PROGRESS */

.progress-box{
display:none;
margin-top:20px;
padding:20px;
background:#080c15;
border-radius:14px;
border:1px solid #25314a;
}

.progress-text{
margin-bottom:12px;
color:#c8cde0;
}

.progress-bar{
height:8px;
background:#1b2435;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:#7c5cff;
transition:width .5s;
}

/* VIDEO */

.video-result{
display:none;
margin-top:20px;
}

.video-result video{
width:100%;
max-height:500px;
border-radius:14px;
background:black;
}

.video-actions{
display:flex;
gap:10px;
margin-top:12px;
}

.action-btn{
padding:12px 18px;
background:#171e30;
color:white;
border-radius:9px;
}

.download{
background:#7c5cff;
}

/* PROJECTS */

.projects{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.project{
background:#0d1320;
border:1px solid #1b2538;
border-radius:15px;
overflow:hidden;
}

.project video{
width:100%;
height:180px;
object-fit:cover;
background:#000;
}

.project-info{
padding:15px;
}

.project-info h3{
font-size:16px;
margin-bottom:7px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.project-info small{
color:#7f8ba3;
}

.project-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.project-buttons button{
padding:9px 12px;
border-radius:8px;
background:#192238;
color:white;
}

.project-buttons .download{
background:#7c5cff;
}

/* EMPTY */

.empty{
padding:50px;
text-align:center;
color:#78849b;
background:#0d1320;
border:1px solid #1b2538;
border-radius:16px;
}

/* CREDITS */

.credit-box{
text-align:center;
padding:40px;
}

.credit-number{
font-size:55px;
font-weight:bold;
color:#8c70ff;
margin:15px;
}

/* MOBILE */

@media(max-width:800px){

.sidebar{
width:70px;
padding:20px 8px;
}

.logo{
font-size:15px;
text-align:center;
}

.nav button{
font-size:0;
text-align:center;
}

.nav button::first-letter{
font-size:20px;
}

.main{
margin-left:70px;
width:calc(100% - 70px);
padding:18px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.options{
grid-template-columns:1fr;
}

.projects{
grid-template-columns:1fr;
}

.top h1{
font-size:21px;
}

.profile{
font-size:12px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">
KLYRO <span>AI</span>
</div>

<div class="nav">

<button class="active" onclick="showPage('dashboard',this)">
🏠 Dashboard
</button>

<button onclick="showPage('create',this)">
🎬 Create Video
</button>

<button onclick="showPage('projects',this)">
📁 My Projects
</button>

<button onclick="showPage('credits',this)">
💳 Credits
</button>

</div>

</aside>


<!-- MAIN -->

<main class="main">

<div class="top">

<h1 id="pageTitle">Dashboard</h1>

<div class="profile">
KLYRO User
</div>

</div>


<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="stats">

<div class="card">
<small>Available Credits</small>
<h2 id="creditStat">10</h2>
</div>

<div class="card">
<small>Videos Created</small>
<h2 id="videoStat">0</h2>
</div>

<div class="card">
<small>Projects</small>
<h2 id="projectStat">0</h2>
</div>

<div class="card">
<small>Current Plan</small>
<h2>Free</h2
</div>
</div>

</div>

</section>


<!-- CREATE VIDEO -->

<section id="create" class="page">

<div class="create-box">

<h2>🎬 Create New Video</h2>

<textarea id="createPrompt"
placeholder="Describe the video you want KLYRO AI to create..."></textarea>

<div class="options">

<select>
<option>16:9 Landscape</option>
<option>9:16 Portrait</option>
<option>1:1 Square</option>
</select>

<select>
<option>480p</option>
<option>720p</option>
</select>

<select>
<option>Cinematic</option>
<option>Realistic</option>
<option>Anime</option>
</select>

</div>

<button class="generate" onclick="generateFromCreate()">
🚀 Generate Video
</button>

<div class="progress-box" id="progressBox">

<div class="progress-text" id="progressText">
Preparing KLYRO AI...
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

</div>

<div class="video-result" id="videoResult">

<video id="resultVideo" controls></video>

<div class="video-actions">

<button class="action-btn download"
onclick="downloadCurrent()">
⬇️ Download
</button>

<button class="action-btn"
onclick="saveProject()">
📁 Save Project
</button>

</div>

</div>

</div>

</section>


<!-- PROJECTS -->

<section id="projects" class="page">

<div id="projectList"></div>

</section>


<!-- CREDITS -->

<section id="credits" class="page">

<div class="card credit-box">

<h2>💳 Your KLYRO Credits</h2>

<div class="credit-number" id="creditBig">10</div>

<p>Your credits for AI video generation.</p>

</div>

</section>

</main>

</div>


<script>

let credits =
Number(localStorage.getItem("klyroCredits")) || 10;

let videosCreated =
Number(localStorage.getItem("klyroVideos")) || 0;

let projects =
JSON.parse(localStorage.getItem("klyroProjects") || "[]");

let currentVideo = null;
let currentPrompt = "";


/* PAGE NAVIGATION */

function showPage(page,button){

document.querySelectorAll(".page")
.forEach(p => p.classList.remove("active"));

let selected=document.getElementById(page);

if(selected){
selected.classList.add("active");
}

document.querySelectorAll(".nav button")
.forEach(b => b.classList.remove("active"));

if(button){
button.classList.add("active");
}

let titles={
dashboard:"Dashboard",
create:"Create Video",
projects:"My Projects",
credits:"Credits"
};

document.getElementById("pageTitle").innerText =
titles[page] || "KLYRO AI";

if(page==="projects"){
renderProjects();
}

updateStats();

}


/* STATS */

function updateStats(){

document.getElementById("creditStat").innerText=credits;

document.getElementById("videoStat").innerText=videosCreated;

document.getElementById("projectStat").innerText=projects.length;

document.getElementById("creditBig").innerText=credits;

localStorage.setItem("klyroCredits",credits);

localStorage.setItem("klyroVideos",videosCreated);

}


/* GENERATE FROM CREATE PAGE */

async function generateFromCreate(){

let prompt =
document.getElementById("createPrompt").value.trim();

if(!prompt){

alert("Please enter a prompt.");

return;
}

await startGeneration(prompt);

}


/* GENERATION */

async function startGeneration(prompt){

if(credits<=0){

alert("No credits available.");

return;

}

currentPrompt=prompt;

let box=document.getElementById("progressBox");

let text=document.getElementById("progressText");

let fill=document.getElementById("progressFill");

let result=document.getElementById("videoResult");

box.style.display="block";

result.style.display="none";

fill.style.width="10%";

text.innerText="Sending request to KLYRO AI...";

try{

let response=await fetch("/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
prompt:prompt
})

});

let data=await response.json();

if(!response.ok){

throw new Error(data.error || "Generation failed");

}

fill.style.width="30%";

text.innerText=
"KLYRO AI is creating your video... ⏳";

let id=data.id;

while(true){

await new Promise(
resolve=>setTimeout(resolve,3000)
);

let statusResponse=
await fetch("/status?id="+encodeURIComponent(id));

let statusData=
await statusResponse.json();

if(statusData.status==="succeeded"){

fill.style.width="100%";

text.innerText=
"Video created successfully! 🎉";

currentVideo=statusData.output;

videosCreated++;

credits--;

updateStats();

showVideo(currentVideo);

break;

}

if(
statusData.status==="failed" ||
statusData.status==="canceled"
){

throw new Error(
statusData.error || "Video generation failed"
);

}

fill.style.width="60%";

text.innerText=
"Generating video... Please wait ⏳";

}

}catch(error){

fill.style.width="0%";

text.innerText="Generation failed ❌";

alert(error.message);

}

}


/* SHOW VIDEO */

function showVideo(url){

let video=document.getElementById("resultVideo");

video.src=url;

document.getElementById("videoResult")
.style.display="block";

}


/* DOWNLOAD */

function downloadCurrent(){

if(!currentVideo){

alert("No video available.");

return;

}

window.open(currentVideo,"_blank");

}


/* SAVE PROJECT */

function saveProject(){

if(!currentVideo){

alert("Generate a video first.");

return;

}

let project={

id:Date.now(),

name:
currentPrompt.substring(0,45) ||
"KLYRO AI Video",

prompt:currentPrompt,

video:currentVideo,

date:new Date().toLocaleString()

};

projects.unshift(project);

localStorage.setItem(
"klyroProjects",
JSON.stringify(projects)
);

updateStats();

alert("Project saved successfully! 📁");

}


/* PROJECTS */

function renderProjects(){

let container=
document.getElementById("projectList");

if(projects.length===0){

container.innerHTML=`
<div class="empty">

<h2>No Projects Yet</h2>

<p style="margin-top:10px">
Your generated videos will appear here.
</p>

</div>
`;

return;

}

container.innerHTML=`

<div class="projects">

${projects.map(p=>`

<div class="project">

<video
src="${p.video}"
controls>
</video>

<div class="project-info">

<h3>${escapeHTML(p.name)}</h3>

<small>${p.date}</small>

<div class="project-buttons">

<button
onclick="window.open('${p.video}','_blank')">
▶️ Open
</button>

<button
class="download"
onclick="downloadProject('${p.video}')">
⬇️
</button>

<button
onclick="deleteProject(${p.id})">
🗑️
</button>

</div>

</div>

</div>

`).join("")}

</div>
`;

}


/* DOWNLOAD PROJECT */

function downloadProject(url){

window.open(url,"_blank");

}


/* DELETE */

function deleteProject(id){

if(!confirm("Delete this project?")){

return;

}

projects=
projects.filter(p=>p.id!==id);

localStorage.setItem(
"klyroProjects",
JSON.stringify(projects)
);

renderProjects();

updateStats();

}


/* HTML SAFETY */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

updateStats();

</script>

</body>
</html>
