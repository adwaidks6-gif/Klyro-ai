<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLYRO AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#050509;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.container{
  width:92%;
  max-width:700px;
  text-align:center;
}

.logo{
  font-size:48px;
  font-weight:800;
  letter-spacing:3px;
}

.logo span{color:#8b2cff}

.subtitle{
  color:#aaa;
  margin:10px 0 35px;
}

.box{
  background:#101016;
  border:1px solid #292936;
  border-radius:20px;
  padding:25px;
}

textarea{
  width:100%;
  height:150px;
  padding:18px;
  border-radius:14px;
  background:#07070c;
  color:white;
  border:1px solid #292936;
  font-size:16px;
  outline:none;
  resize:none;
}

button{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#7c3aed;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

#status{
  margin-top:20px;
  color:#aaa;
  min-height:22px;
}

#videoContainer{
  margin-top:20px;
}

#videoContainer video{
  width:100%;
  border-radius:14px;
}

.footer{
  margin-top:30px;
  color:#555;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
KLYRO <span>AI</span>
</div>

<div class="subtitle">
AI-powered video generation platform
</div>

<div class="box">

<textarea id="prompt"
placeholder="Describe your video..."></textarea>

<button id="generateBtn"
onclick="generateVideo()">
✨ Generate Video
</button>

<div id="status">
Ready to create.
</div>

<div id="videoContainer"></div>

</div>

<div class="footer">
© 2026 KLYRO AI • Create. Imagine. Generate.
</div>

</div>

<script>

async function generateVideo(){

const prompt =
document.getElementById("prompt").value.trim();

const status =
document.getElementById("status");

const button =
document.getElementById("generateBtn");

const videoContainer =
document.getElementById("videoContainer");

if(!prompt){
status.innerText =
"⚠️ Please describe your video first.";
return;
}

button.disabled=true;
videoContainer.innerHTML="";

status.innerText =
"🚀 KLYRO AI is starting video generation...";

try{

const response=await fetch("/generate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:prompt
})
});

const data=await response.json();

if(!response.ok){
throw new Error(
data.error || "Generation failed"
);
}

status.innerText =
"🎬 Video is generating... Please wait.";

while(true){

await new Promise(resolve =>
setTimeout(resolve,4000)
);

const result=await fetch(
"/status?id="+data.id
);

const resultData=await result.json();

if(resultData.status==="succeeded"){

let videoUrl=resultData.output;

if(Array.isArray(videoUrl)){
videoUrl=videoUrl[0];
}

status.innerText =
"✅ Video generated successfully!";

videoContainer.innerHTML=`
<video controls playsinline>
<source src="${videoUrl}" type="video/mp4">
Your browser does not support video.
</video>
`;

break;
}

if(
resultData.status==="failed" ||
resultData.status==="canceled"
){

throw new Error(
resultData.error ||
"Video generation failed"
);

}

status.innerText =
"🎬 KLYRO AI is generating your video...";

}

}catch(error){

status.innerText =
"❌ "+error.message;

}finally{

button.disabled=false;

}

}

</script>

</body>
</html>
