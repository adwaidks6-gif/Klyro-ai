<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KLYRO AI - Dashboard</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#05070d;
color:white;
min-height:100vh;
}

button{
cursor:pointer;
border:none;
}

.app{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:240px;
position:fixed;
left:0;
top:0;
bottom:0;
background:#0a0e18;
border-right:1px solid #182033;
padding:25px 16px;
z-index:10;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:35px;
}

.logo span{
color:#7c5cff;
}

.nav button{
width:100%;
padding:14px;
margin-bottom:8px;
background:transparent;
color:#aeb7ca;
text-align:left;
border-radius:10px;
font-size:15px;
}

.nav button:hover,
.nav button.active{
background:#171d30;
color:white;
}

/* MAIN */

.main{
margin-left:240px;
width:calc(100% - 240px);
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.top h1{
font-size:28px;
}

.profile{
background:#121827;
padding:10px 15px;
border-radius:12px;
color:#b9c1d3;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.card{
background:#0d1320;
border:1px solid #1b2538;
border-radius:16px;
padding:20px;
}

.card small{
color:#7f8ba3;
}

.card h2{
margin-top:10px;
font-size:25px;
}

/* SECTIONS */

.page{
display:none;
}

.page.active{
display:block;
}

.create-box{
background:#0d1320;
border:1px solid #1b2538;
border-radius:18px;
padding:25px;
}

.create-box h2{
margin-bottom:15px;
}

textarea{
width:100%;
height:150px;
background:#080c15;
border:1px solid #25314a;
border-radius:12px;
padding:16px;
color:white;
font-size:15px;
resize:none;
outline:none;
}

textarea:focus{
border-color:#7c5cff;
}

.options{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:15px;
}

select{
width:100%;
padding:13px;
background:#080c15;
color:white;
border:1px solid #25314a;
border-radius:10px;
}

.generate{
width:100%;
margin-top:18px;
padding:16px;
border-radius:12px;
background:linear-gradient(135deg,#7c5cff,#b34cff);
color:white;
font-size:16px;
font-weight:bold;
}

.generate:disabled{
opacity:.5;
}

/* PROGRESS */

.progress-box{
display:none;
margin-top:20px;
padding:20px;
background:#080c15;
border-radius:14px;
border:1px solid #25314a;
}

.progress-text{
margin-bottom:12px;
color:#c8cde0;
}

.progress-bar{
height:8px;
background:#1b2435;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:#7c5cff;
transition:width .5s;
}

/* VIDEO */

.video-result{
display:none;
margin-top:20px;
}

.video-result video{
width:100%;
max-height:500px;
border-radius:14px;
background:black;
}

.video-actions{
display:flex;
gap:10px;
margin-top:12px;
}

.action-btn{
padding:12px 18px;
background:#171e30;
color:white;
border-radius:9px;
}

.download{
background:#7c5cff;
}

/* PROJECTS */

.projects{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.project{
background:#0d1320;
border:1px solid #1b2538;
border-radius:15px;
overflow:hidden;
}

.project video{
width:100%;
height:180px;
object-fit:cover;
background:#000;
}

.project-info{
padding:15px;
}

.project-info h3{
font-size:16px;
margin-bottom:7px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.project-info small{
color:#7f8ba3;
}

.project-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.project-buttons button{
padding:9px 12px;
border-radius:8px;
background:#192238;
color:white;
}

.project-buttons .download{
background:#7c5cff;
}

/* EMPTY */

.empty{
padding:50px;
text-align:center;
color:#78849b;
background:#0d1320;
border:1px solid #1b2538;
border-radius:16px;
}

/* CREDITS */

.credit-box{
text-align:center;
padding:40px;
}

.credit-number{
font-size:55px;
font-weight:bold;
color:#8c70ff;
margin:15px;
}

/* MOBILE */

@media(max-width:800px){

.sidebar{
width:70px;
padding:20px 8px;
}

.logo{
font-size:15px;
text-align:center;
}

.nav button{
font-size:0;
text-align:center;
}

.nav button::first-letter{
font-size:20px;
}

.main{
margin-left:70px;
width:calc(100% - 70px);
padding:18px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.options{
grid-template-columns:1fr;
}

.projects{
grid-template-columns:1fr;
}

.top h1{
font-size:21px;
}

.profile{
font-size:12px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">
KLYRO <span>AI</span>
</div>

<div class="nav">

<button class="active" onclick="showPage('dashboard',this)">
🏠 Dashboard
</button>

<button onclick="showPage('create',this)">
🎬 Create Video
</button>

<button onclick="showPage('projects',this)">
📁 My Projects
</button>

<button onclick="showPage('credits',this)">
💳 Credits
</button>

</div>

</aside>


<!-- MAIN -->

<main class="main">

<div class="top">

<h1 id="pageTitle">Dashboard</h1>

<div class="profile">
KLYRO User
</div>

</div>


<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="stats">

<div class="card">
<small>Available Credits</small>
<h2 id="creditStat">10</h2>
</div>

<div class="card">
<small>Videos Created</small>
<h2 id="videoStat">0</h2>
</div>

<div class="card">
<small>Projects</small>
<h2 id="projectStat">0</h2>
</div>

<div class="card">
<small>Current Plan</small>
<h2>Free</h2
